<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les Saveurs d'Orients — Thiès</title>
<style>
:root{--g:#174d35;--gold:#dda62b;--red:#ad2e2e;--cream:#fbf3df;--brown:#a95b36;--ink:#173b2b}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:#fffdf8}
header{position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid #eee;padding:14px 4%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:clamp(18px,4vw,30px)} .brand span{color:var(--gold)}
.cart{border:0;border-radius:18px;background:var(--g);color:#fff;font-weight:800;padding:13px 18px;font-size:17px}
.hero{padding:30px 5%;background:linear-gradient(135deg,#fff8e8,#f7e7bd);text-align:center}.hero h1{margin:0 0 8px;font-size:clamp(28px,7vw,48px)}
.hero p{margin:6px}.tools{padding:18px 4%;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
input,select,textarea{font:inherit;border:1px solid #ddd1ba;border-radius:12px;padding:12px;background:#fff}.tools input{min-width:230px;flex:1;max-width:500px}
.grid{padding:0 3% 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;max-width:1200px;margin:auto}
.card{border:1px solid #eadfc9;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 3px 14px #0000000b;display:flex;flex-direction:column}
.photo{height:230px;background:var(--cream);display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}
.body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}.cat{font-weight:700;color:var(--brown)}h3{margin:0;font-size:22px}.price{font-size:24px;font-weight:900;color:var(--red)}
.add{margin-top:auto;border:0;border-radius:13px;background:var(--g);color:#fff;padding:14px;font-weight:800;font-size:16px}
#drawer{display:none;position:fixed;inset:0;background:#0007;z-index:20}#panel{margin-left:auto;width:min(94%,460px);height:100%;background:white;padding:20px;overflow:auto}
.line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:10px 0}.close{float:right;border:0;background:#eee;border-radius:50%;width:38px;height:38px;font-size:20px}
.whatsapp{display:block;text-decoration:none;text-align:center;background:#128c4a;color:#fff;padding:15px;border-radius:13px;font-weight:900;margin-top:16px}
footer{text-align:center;background:var(--g);color:white;padding:24px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:165px}.body{padding:12px}h3{font-size:17px}.price{font-size:20px}.brand{font-size:18px}.cart{padding:11px}}
</style>
</head>
<body>
<header><div class="brand">🌿 LES SAVEURS <span>D'ORIENTS</span></div><button class="cart" onclick="openCart()">🛒 Panier <b id="count">0</b></button></header>
<section class="hero"><h1>Produits Bio & Naturels</h1><p>📍 Thiès, Sénégal</p><p>🚚 Livraison partout à Thiès à partir de 500 F</p></section>
<div class="tools"><input id="q" placeholder="Rechercher un produit…" oninput="render()"><select id="filter" onchange="render()"><option value="">Toutes les catégories</option><option>Huiles</option><option>Savons</option><option>Miel & infusion</option></select></div>
<main class="grid" id="grid"></main>
<div id="drawer" onclick="if(event.target===this)closeCart()"><div id="panel"><button class="close" onclick="closeCart()">×</button><h2>Votre panier</h2><div id="items"></div><h3 id="total"></h3><a id="wa" class="whatsapp" target="_blank">Commander sur WhatsApp</a></div></div>
<footer><b>Les Saveurs d'Orients</b><br>WhatsApp : +221 77 115 25 70<br><small>Lun–Ven 9h–15h • Sam 16h–18h • Dim OFF</small></footer>
<script>
const products=[
["Huile d'amande douce","Huiles","huile-amande-douce.jpg","30 ml",2000],
["Huile d'argan","Huiles","huile-argan.jpg","30 ml",2000],
["Huile de graines de nigelle","Huiles","huile-nigelle.jpg","30 ml",3500],
["Huile de ricin","Huiles","huile-ricin.jpg","30 ml",2000],
["Huile de rose","Huiles","huile-rose.jpg","30 ml",2000],
["Infusion bien-être","Miel & infusion","infusion-bien-etre.jpg","Sachet",2000],
["Miel Daghmouss","Miel & infusion","miel-daghmouss.jpg","250 g",7000],
["Miel Daghmouss","Miel & infusion","miel-daghmouss.jpg","500 g",13000],
["Savon Nila bleu","Savons","savon-nila-bleu.jpg","Unité",2000],
["Savon figue de barbarie","Savons","savon-figue-barbarie.jpg","Unité",2000],
["Savon noir marocain","Savons","savon-noir.jpg","250 g",1500],
["Savon Tahara","Savons","savon-tahara.jpg","Unité",2000],
["Savon d'argan","Savons","savon-argan.jpg","Unité",2000]
];
let cart=JSON.parse(localStorage.getItem("lso_cart2")||"[]");
function render(){let q=document.querySelector("#q").value.toLowerCase(),f=document.querySelector("#filter").value;
document.querySelector("#grid").innerHTML=products.map((p,i)=>({p,i})).filter(x=>(!f||x.p[1]===f)&&x.p[0].toLowerCase().includes(q)).map(x=>`<article class="card"><div class="photo"><img src="${x.p[2]}" alt="${x.p[0]}" loading="lazy"></div><div class="body"><span class="cat">${x.p[1]}</span><h3>${x.p[0]}</h3><div>${x.p[3]}</div><div class="price">${x.p[4].toLocaleString("fr-FR")} F</div><button class="add" onclick="add(${x.i})">+ Ajouter au panier</button></div></article>`).join("")}
function add(i){cart.push(i);save()} function save(){localStorage.setItem("lso_cart2",JSON.stringify(cart));document.querySelector("#count").textContent=cart.length}
function openCart(){let counts={};cart.forEach(i=>counts[i]=(counts[i]||0)+1);let sum=0;
document.querySelector("#items").innerHTML=Object.entries(counts).map(([i,n])=>{let p=products[i];sum+=p[4]*n;return `<div class="line"><span>${p[0]} — ${p[3]} × ${n}</span><b>${(p[4]*n).toLocaleString("fr-FR")} F</b></div>`}).join("")||"<p>Votre panier est vide.</p>";
document.querySelector("#total").textContent="Total produits : "+sum.toLocaleString("fr-FR")+" F";
let msg="Bonjour Les Saveurs d’Orients, je souhaite commander :\n"+Object.entries(counts).map(([i,n])=>`- ${products[i][0]} (${products[i][3]}) x${n}`).join("\n")+"\nTotal produits : "+sum.toLocaleString("fr-FR")+" F\nLivraison à confirmer.";
document.querySelector("#wa").href="https://wa.me/221771152570?text="+encodeURIComponent(msg);document.querySelector("#drawer").style.display="block"}
function closeCart(){document.querySelector("#drawer").style.display="none"} render();save();
</script>
</body></html>
